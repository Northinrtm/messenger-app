limit_req_zone $binary_remote_addr zone=ws_request_rate:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ws_connection_count:10m;
log_format ws_access_json escape=json
    '{'
        '"kind":"ws_access",'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"proxy_peer_addr":"$realip_remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"request_time":"$request_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"bytes_sent":"$bytes_sent",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"connection":"$connection",'
        '"connection_requests":"$connection_requests",'
        '"upgrade":"$http_upgrade",'
        '"user_agent":"$http_user_agent"'
    '}';

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    root /usr/share/nginx/html;
    index index.html;
    set $backend_upstream http://backend:8080;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; frame-src 'self'; font-src 'self' data:; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location = /build-meta.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /build-meta.json =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /downloads/ {
        # Serve real download artifacts (the Android APK) directly. Must NOT fall back to the SPA
        # index.html: a missing file has to return 404, otherwise the browser saves index.html
        # under the .apk name and Android rejects it with "не удалось обработать пакет".
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /storage/ {
        # Presigned MinIO upload/download URLs are served same-origin through here so the browser
        # never needs CORS. Strip the /storage prefix and forward to MinIO, preserving the original
        # Host (including port) because it is part of the SigV4 signature the backend produced
        # against the public endpoint. Mirrors the edge Caddy `handle_path /storage/*` in prod.
        set $minio_upstream http://minio:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 64m;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        # Trust the edge proxy so websocket limits apply per real client IP, not per Docker peer.
        access_log /dev/stdout ws_access_json;
        limit_req zone=ws_request_rate burst=20 nodelay;
        limit_conn ws_connection_count 20;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
