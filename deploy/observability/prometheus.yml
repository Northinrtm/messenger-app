global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: messenger-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: __APP_ACTUATOR_SCRAPE_USERNAME__
      password: __APP_ACTUATOR_SCRAPE_PASSWORD__
    static_configs:
      - targets:
          - backend:8080

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
