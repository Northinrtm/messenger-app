services:
  postgres:
    image: postgres:17
    container_name: messenger-postgres
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: public.ecr.aws/docker/library/redis:7.2.11-alpine
    profiles:
      - redis
    container_name: messenger-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: messenger-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: messenger-jitsi-prosody
    hostname: xmpp.meet.jitsi
    environment:
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_RECORDING: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:-messenger-jicofo-component}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-messenger-focus-password}
      JIBRI_XMPP_USER: jibri
      JIBRI_XMPP_PASSWORD: ${JITSI_JIBRI_XMPP_PASSWORD:-messenger-jibri-password}
      JIBRI_RECORDER_USER: recorder
      JIBRI_RECORDER_PASSWORD: ${JITSI_JIBRI_RECORDER_PASSWORD:-messenger-recorder-password}
      JIBRI_BREWERY_MUC: jibribrewery
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-messenger-jvb-password}
      JVB_BREWERY_MUC: jvbbrewery
    networks:
      default:
        aliases:
          - xmpp.meet.jitsi
    volumes:
      - jitsi_prosody_config:/config

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: messenger-jitsi-jicofo
    depends_on:
      - jitsi-prosody
    environment:
      ENABLE_AUTH: "0"
      ENABLE_RECORDING: "1"
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:-messenger-jicofo-component}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-messenger-focus-password}
      JIBRI_XMPP_USER: jibri
      JIBRI_XMPP_PASSWORD: ${JITSI_JIBRI_XMPP_PASSWORD:-messenger-jibri-password}
      JIBRI_RECORDER_USER: recorder
      JIBRI_RECORDER_PASSWORD: ${JITSI_JIBRI_RECORDER_PASSWORD:-messenger-recorder-password}
      JIBRI_BREWERY_MUC: jibribrewery
      JIBRI_PENDING_TIMEOUT: 90
      JVB_BREWERY_MUC: jvbbrewery
    volumes:
      - jitsi_jicofo_config:/config

  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: messenger-jitsi-jvb
    depends_on:
      - jitsi-prosody
    environment:
      ENABLE_AUTH: "0"
      ENABLE_COLIBRI_WEBSOCKET: "1"
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-messenger-jvb-password}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
      JVB_TCP_HARVESTER_DISABLED: "false"
      JVB_TCP_HARVESTER_PORT: 4443
      JVB_ADVERTISE_IPS: ${JITSI_ADVERTISE_IPS:-127.0.0.1}
    ports:
      - "10000:10000/udp"
      - "4443:4443"
    volumes:
      - jitsi_jvb_config:/config

  jitsi-web:
    image: jitsi/web:stable
    container_name: messenger-jitsi-web
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    environment:
      DISABLE_HTTPS: "1"
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      ENABLE_RECORDING: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8090}
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
    ports:
      - "8090:80"
    volumes:
      - jitsi_web_config:/config
      - ./jitsi/custom-config.js:/config/custom-config.js

  jitsi-jibri:
    image: jitsi/jibri:stable
    profiles:
      - autonomous-recording
    container_name: messenger-jitsi-jibri
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-web
    environment:
      DISPLAY: ":0"
      JIBRI_BREWERY_MUC: jibribrewery
      JIBRI_RECORDING_DIR: /config/recordings
      JIBRI_RECORDER_PASSWORD: ${JITSI_JIBRI_RECORDER_PASSWORD:-messenger-recorder-password}
      JIBRI_RECORDER_USER: recorder
      JIBRI_XMPP_PASSWORD: ${JITSI_JIBRI_XMPP_PASSWORD:-messenger-jibri-password}
      JIBRI_XMPP_USER: jibri
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8090}
      TZ: ${TZ:-Europe/Moscow}
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
    cap_add:
      - SYS_ADMIN
    shm_size: 2gb
    volumes:
      - jitsi_jibri_config:/config
      - conference_recordings_raw:/config/recordings
      - /dev/shm:/dev/shm
      - /var/run/dbus:/var/run/dbus
      - /sys/devices/system/cpu:/sys/devices/system/cpu:ro
      - /dev/snd:/dev/snd

  backend:
    build:
      context: ./backend
      provenance: false
      sbom: false
    container_name: messenger-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/messenger
      DB_USERNAME: messenger
      DB_PASSWORD: messenger
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      APP_REALTIME_REDIS_ENABLED: ${APP_REALTIME_REDIS_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      APP_JWT_REFRESH_TOKEN_TTL: P30D
      APP_AUTH_REGISTRATION_ALLOWED_EMAIL_DOMAINS: ${APP_AUTH_REGISTRATION_ALLOWED_EMAIL_DOMAINS:-gmail.com,googlemail.com,outlook.com,hotmail.com,live.com,msn.com,yahoo.com,icloud.com,me.com,mac.com,yandex.ru,yandex.com,ya.ru,mail.ru,bk.ru,inbox.ru,list.ru}
      APP_AUTH_EMAIL_VERIFICATION_ENABLED: ${APP_AUTH_EMAIL_VERIFICATION_ENABLED:-true}
      APP_AUTH_EMAIL_VERIFICATION_TOKEN_TTL: ${APP_AUTH_EMAIL_VERIFICATION_TOKEN_TTL:-PT24H}
      APP_AUTH_EMAIL_VERIFICATION_URL_BASE: ${APP_AUTH_EMAIL_VERIFICATION_URL_BASE:-http://localhost:3000/}
      APP_AUTH_EMAIL_VERIFICATION_FROM_ADDRESS: ${APP_AUTH_EMAIL_VERIFICATION_FROM_ADDRESS:-no-reply@localhost.test}
      APP_AUTH_PASSWORD_RESET_ENABLED: ${APP_AUTH_PASSWORD_RESET_ENABLED:-true}
      APP_AUTH_PASSWORD_RESET_TOKEN_TTL: ${APP_AUTH_PASSWORD_RESET_TOKEN_TTL:-PT30M}
      APP_AUTH_PASSWORD_RESET_URL_BASE: ${APP_AUTH_PASSWORD_RESET_URL_BASE:-http://localhost:3000/}
      APP_AUTH_PASSWORD_RESET_FROM_ADDRESS: ${APP_AUTH_PASSWORD_RESET_FROM_ADDRESS:-no-reply@localhost.test}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_SMTP_SSL_ENABLE:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
      APP_MEDIA_CONFERENCE_RECORDINGS_DIRECTORY: /app/storage/conference-recordings
      APP_MEDIA_CONFERENCE_RECORDINGS_IMPORT_DIRECTORY: /jibri-recordings
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - conference_recordings_archive:/app/storage/conference-recordings
      - conference_recordings_raw:/jibri-recordings:ro

  web:
    build:
      context: ./web
      provenance: false
      sbom: false
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
        VITE_JITSI_BASE_URL: ${JITSI_PUBLIC_URL:-http://localhost:8090}
    container_name: messenger-web
    depends_on:
      - backend
      - jitsi-web
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  jitsi_prosody_config:
  jitsi_jicofo_config:
  jitsi_jvb_config:
  jitsi_jibri_config:
  jitsi_web_config:
  conference_recordings_raw:
  conference_recordings_archive:
