server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: messenger-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${DB_USERNAME:messenger}
    password: ${DB_PASSWORD:messenger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: north-messenger
    access-token-ttl: PT12H
    secret: ${APP_JWT_SECRET:bWVzc2VuZ2VyLWFwcC1kZW1vLXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LXRoaXMtbXVzdC1iZS1yZXBsYWNlZA==}

logging:
  level:
    org.springframework.web.socket: INFO

