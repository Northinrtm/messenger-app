server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: messenger-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${DB_USERNAME:messenger}
    password: ${DB_PASSWORD:messenger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    refresh-cookie:
      name: ${APP_AUTH_REFRESH_COOKIE_NAME:north_refresh_token}
      path: ${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
  jwt:
    issuer: north-messenger
    access-token-ttl: PT12H
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:P30D}
    secret: ${APP_JWT_SECRET:}
    generate-secret-if-missing: ${APP_JWT_GENERATE_SECRET_IF_MISSING:false}

logging:
  level:
    org.springframework.web.socket: INFO
