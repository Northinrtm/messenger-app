server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: messenger-backend
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${DB_USERNAME:messenger}
    password: ${DB_PASSWORD:messenger}
    hikari:
      minimum-idle: ${APP_DB_MIN_IDLE:2}
      maximum-pool-size: ${APP_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:3000}
      initialization-fail-timeout: ${APP_DB_INITIALIZATION_FAIL_TIMEOUT_MS:10000}
      idle-timeout: ${APP_DB_IDLE_TIMEOUT_MS:120000}
      max-lifetime: ${APP_DB_MAX_LIFETIME_MS:600000}
      keepalive-time: ${APP_DB_KEEPALIVE_TIME_MS:30000}
      data-source-properties:
        connectTimeout: ${APP_DB_CONNECT_TIMEOUT_SECONDS:5}
        socketTimeout: ${APP_DB_SOCKET_TIMEOUT_SECONDS:30}
        tcpKeepAlive: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
          ssl:
            enable: ${SPRING_MAIL_SMTP_SSL_ENABLE:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.2}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}

app:
  actuator:
    scrape:
      username: ${APP_ACTUATOR_SCRAPE_USERNAME:}
      password: ${APP_ACTUATOR_SCRAPE_PASSWORD:}
  auth:
    registration:
      allowed-email-domains: ${APP_AUTH_REGISTRATION_ALLOWED_EMAIL_DOMAINS:gmail.com,googlemail.com,outlook.com,hotmail.com,live.com,msn.com,yahoo.com,yahoo.co.uk,yahoo.co.jp,icloud.com,me.com,mac.com,yandex.ru,yandex.com,ya.ru,mail.ru,bk.ru,inbox.ru,list.ru,rambler.ru,lenta.ru,myrambler.ru,autorambler.ru,proton.me,protonmail.com,pm.me,aol.com,gmx.com,gmx.de,gmx.net,fastmail.com,zoho.com}
    email-verification:
      enabled: ${APP_AUTH_EMAIL_VERIFICATION_ENABLED:false}
      token-ttl: ${APP_AUTH_EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
      url-base: ${APP_AUTH_EMAIL_VERIFICATION_URL_BASE:}
      from-address: ${APP_AUTH_EMAIL_VERIFICATION_FROM_ADDRESS:${SPRING_MAIL_USERNAME:}}
    refresh-cookie:
      name: ${APP_AUTH_REFRESH_COOKIE_NAME:north_refresh_token}
      path: ${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
    password-reset:
      enabled: ${APP_AUTH_PASSWORD_RESET_ENABLED:false}
      token-ttl: ${APP_AUTH_PASSWORD_RESET_TOKEN_TTL:PT30M}
      url-base: ${APP_AUTH_PASSWORD_RESET_URL_BASE:}
      from-address: ${APP_AUTH_PASSWORD_RESET_FROM_ADDRESS:${SPRING_MAIL_USERNAME:}}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  realtime:
    redis:
      enabled: ${APP_REALTIME_REDIS_ENABLED:false}
      mac-secret: ${APP_REALTIME_REDIS_MAC_SECRET:}
    typing-active-window-ms: ${APP_TYPING_ACTIVE_WINDOW_MS:10000}
  jwt:
    issuer: north-messenger
    audience: north-messenger-clients
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:P30D}
    secret: ${APP_JWT_SECRET:}
    generate-secret-if-missing: ${APP_JWT_GENERATE_SECRET_IF_MISSING:false}
  media:
    conference-recordings:
      directory: ${APP_MEDIA_CONFERENCE_RECORDINGS_DIRECTORY:./storage/conference-recordings}
      import-directory: ${APP_MEDIA_CONFERENCE_RECORDINGS_IMPORT_DIRECTORY:./storage/jibri-recordings}

logging:
  pattern:
    correlation: "[trace_id=%X{traceId:-} span_id=%X{spanId:-}] "
  level:
    org.springframework.web.socket: INFO
