server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: messenger-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${DB_USERNAME:messenger}
    password: ${DB_PASSWORD:messenger}
    hikari:
      minimum-idle: ${APP_DB_MIN_IDLE:2}
      maximum-pool-size: ${APP_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:3000}
      initialization-fail-timeout: ${APP_DB_INITIALIZATION_FAIL_TIMEOUT_MS:10000}
      idle-timeout: ${APP_DB_IDLE_TIMEOUT_MS:120000}
      max-lifetime: ${APP_DB_MAX_LIFETIME_MS:600000}
      keepalive-time: ${APP_DB_KEEPALIVE_TIME_MS:30000}
      data-source-properties:
        connectTimeout: ${APP_DB_CONNECT_TIMEOUT_SECONDS:5}
        socketTimeout: ${APP_DB_SOCKET_TIMEOUT_SECONDS:30}
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    refresh-cookie:
      name: ${APP_AUTH_REFRESH_COOKIE_NAME:north_refresh_token}
      path: ${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
      same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
  jwt:
    issuer: north-messenger
    access-token-ttl: PT12H
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:P30D}
    secret: ${APP_JWT_SECRET:}
    generate-secret-if-missing: ${APP_JWT_GENERATE_SECRET_IF_MISSING:false}
  media:
    conference-recordings:
      directory: ${APP_MEDIA_CONFERENCE_RECORDINGS_DIRECTORY:./storage/conference-recordings}
      import-directory: ${APP_MEDIA_CONFERENCE_RECORDINGS_IMPORT_DIRECTORY:./storage/jibri-recordings}

logging:
  level:
    org.springframework.web.socket: INFO
