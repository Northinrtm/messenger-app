x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17
    container_name: messenger-postgres
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=24MB
      - -c
      - effective_cache_size=96MB
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: public.ecr.aws/docker/library/redis:7.2.11-alpine
    container_name: messenger-redis
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --loglevel
      - warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: messenger-minio
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data

  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: messenger-jitsi-prosody
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    hostname: xmpp.meet.jitsi
    environment:
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_RECORDING: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_HIDDEN_DOMAIN: recorder.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:?JITSI_JICOFO_COMPONENT_SECRET must be set}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:?JITSI_JICOFO_AUTH_PASSWORD must be set}
      JIBRI_XMPP_USER: jibri
      JIBRI_XMPP_PASSWORD: ${JITSI_JIBRI_XMPP_PASSWORD:?JITSI_JIBRI_XMPP_PASSWORD must be set}
      JIBRI_RECORDER_USER: recorder
      JIBRI_RECORDER_PASSWORD: ${JITSI_JIBRI_RECORDER_PASSWORD:?JITSI_JIBRI_RECORDER_PASSWORD must be set}
      JIBRI_BREWERY_MUC: jibribrewery
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:?JITSI_JVB_AUTH_PASSWORD must be set}
      JVB_BREWERY_MUC: jvbbrewery
    networks:
      default:
        aliases:
          - xmpp.meet.jitsi
    volumes:
      - jitsi_prosody_config:/config

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: messenger-jitsi-jicofo
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 96m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    depends_on:
      - jitsi-prosody
    environment:
      ENABLE_AUTH: "0"
      ENABLE_RECORDING: "1"
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_HIDDEN_DOMAIN: recorder.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:?JITSI_JICOFO_COMPONENT_SECRET must be set}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:?JITSI_JICOFO_AUTH_PASSWORD must be set}
      JIBRI_XMPP_USER: jibri
      JIBRI_XMPP_PASSWORD: ${JITSI_JIBRI_XMPP_PASSWORD:?JITSI_JIBRI_XMPP_PASSWORD must be set}
      JIBRI_RECORDER_USER: recorder
      JIBRI_RECORDER_PASSWORD: ${JITSI_JIBRI_RECORDER_PASSWORD:?JITSI_JIBRI_RECORDER_PASSWORD must be set}
      JIBRI_BREWERY_MUC: jibribrewery
      JIBRI_PENDING_TIMEOUT: 90
      JVB_BREWERY_MUC: jvbbrewery
    volumes:
      - jitsi_jicofo_config:/config

  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: messenger-jitsi-jvb
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 384
    security_opt:
      - no-new-privileges:true
    depends_on:
      - jitsi-prosody
    environment:
      ENABLE_AUTH: "0"
      ENABLE_COLIBRI_WEBSOCKET: "1"
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:?JITSI_JVB_AUTH_PASSWORD must be set}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
      JVB_TCP_HARVESTER_DISABLED: "false"
      JVB_TCP_HARVESTER_PORT: 4443
      JVB_ADVERTISE_IPS: ${JITSI_ADVERTISE_IPS:?JITSI_ADVERTISE_IPS must be set}
    ports:
      - "10000:10000/udp"
      - "4443:4443"
    volumes:
      - jitsi_jvb_config:/config

  jitsi-web:
    image: jitsi/web:stable
    container_name: messenger-jitsi-web
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    environment:
      DISABLE_HTTPS: "1"
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      ENABLE_RECORDING: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      PUBLIC_URL: ${JITSI_PUBLIC_URL:?JITSI_PUBLIC_URL must be set}
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_HIDDEN_DOMAIN: recorder.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
    volumes:
      - ./jitsi/base.html:/usr/share/jitsi-meet/base.html:ro
      - jitsi_web_config:/config
      - ./jitsi/custom-config.js:/config/custom-config.js

  jitsi-jibri:
    image: jitsi/jibri:stable
    profiles:
      - autonomous-recording
    container_name: messenger-jitsi-jibri
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 2.0
    mem_limit: 2048m
    pids_limit: 1024
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-web
    environment:
      DISPLAY: ":0"
      JIBRI_BREWERY_MUC: jibribrewery
      JIBRI_RECORDING_DIR: /config/recordings
      JIBRI_RECORDER_PASSWORD: ${JITSI_JIBRI_RECORDER_PASSWORD:?JITSI_JIBRI_RECORDER_PASSWORD must be set}
      JIBRI_RECORDER_USER: recorder
      JIBRI_XMPP_PASSWORD: ${JITSI_JIBRI_XMPP_PASSWORD:?JITSI_JIBRI_XMPP_PASSWORD must be set}
      JIBRI_XMPP_USER: jibri
      PUBLIC_URL: ${JITSI_PUBLIC_URL:?JITSI_PUBLIC_URL must be set}
      TZ: ${TZ:-Europe/Moscow}
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_HIDDEN_DOMAIN: recorder.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
    cap_add:
      - SYS_ADMIN
    shm_size: 2gb
    volumes:
      - jitsi_jibri_config:/config
      - conference_recordings_raw:/config/recordings
      - /var/run/dbus:/var/run/dbus
      - /sys/devices/system/cpu:/sys/devices/system/cpu:ro
      - /dev/snd:/dev/snd

  backend:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.75
    mem_limit: 640m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: prod,json-logs
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=42 -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/messenger-backend-oom.hprof -Xlog:gc*:file=/tmp/messenger-backend-gc.log:time,level,tags:filecount=5,filesize=10M -XX:+ExitOnOutOfMemoryError}"
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/messenger}
      DB_USERNAME: ${DB_USERNAME:-messenger}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_DB_MIN_IDLE: ${APP_DB_MIN_IDLE:-1}
      APP_DB_MAX_POOL_SIZE: ${APP_DB_MAX_POOL_SIZE:-4}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      APP_REALTIME_REDIS_ENABLED: ${APP_REALTIME_REDIS_ENABLED:-true}
      APP_AUTH_RATE_LIMIT_REDIS_ENABLED: ${APP_AUTH_RATE_LIMIT_REDIS_ENABLED:-true}
      APP_REALTIME_REDIS_MAC_SECRET: ${APP_REALTIME_REDIS_MAC_SECRET:-}
      APP_REALTIME_WEBSOCKET_MESSAGE_SIZE_LIMIT_BYTES: ${APP_REALTIME_WEBSOCKET_MESSAGE_SIZE_LIMIT_BYTES:-8388608}
      APP_REALTIME_WEBSOCKET_SEND_BUFFER_SIZE_LIMIT_BYTES: ${APP_REALTIME_WEBSOCKET_SEND_BUFFER_SIZE_LIMIT_BYTES:-8388608}
      APP_REALTIME_WEBSOCKET_SEND_TIME_LIMIT_MS: ${APP_REALTIME_WEBSOCKET_SEND_TIME_LIMIT_MS:-20000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS must be set}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_JWT_REFRESH_TOKEN_TTL: ${APP_JWT_REFRESH_TOKEN_TTL:-P30D}
      APP_AUTH_REFRESH_COOKIE_SECURE: ${APP_AUTH_REFRESH_COOKIE_SECURE:-true}
      APP_AUTH_REGISTRATION_ALLOWED_EMAIL_DOMAINS: ${APP_AUTH_REGISTRATION_ALLOWED_EMAIL_DOMAINS:-gmail.com,googlemail.com,outlook.com,hotmail.com,live.com,msn.com,yahoo.com,icloud.com,me.com,mac.com,yandex.ru,yandex.com,ya.ru,mail.ru,bk.ru,inbox.ru,list.ru}
      APP_AUTH_EMAIL_VERIFICATION_ENABLED: ${APP_AUTH_EMAIL_VERIFICATION_ENABLED:-true}
      APP_AUTH_EMAIL_VERIFICATION_TOKEN_TTL: ${APP_AUTH_EMAIL_VERIFICATION_TOKEN_TTL:-PT24H}
      APP_AUTH_EMAIL_VERIFICATION_URL_BASE: ${APP_AUTH_EMAIL_VERIFICATION_URL_BASE:-}
      APP_AUTH_EMAIL_VERIFICATION_FROM_ADDRESS: ${APP_AUTH_EMAIL_VERIFICATION_FROM_ADDRESS:-}
      APP_AUTH_PASSWORD_RESET_ENABLED: ${APP_AUTH_PASSWORD_RESET_ENABLED:-false}
      APP_AUTH_PASSWORD_RESET_TOKEN_TTL: ${APP_AUTH_PASSWORD_RESET_TOKEN_TTL:-PT30M}
      APP_AUTH_PASSWORD_RESET_URL_BASE: ${APP_AUTH_PASSWORD_RESET_URL_BASE:-}
      APP_AUTH_PASSWORD_RESET_FROM_ADDRESS: ${APP_AUTH_PASSWORD_RESET_FROM_ADDRESS:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_SMTP_SSL_ENABLE:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      APP_ACTUATOR_SCRAPE_USERNAME: ${APP_ACTUATOR_SCRAPE_USERNAME:-}
      APP_ACTUATOR_SCRAPE_PASSWORD: ${APP_ACTUATOR_SCRAPE_PASSWORD:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.05}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
      APP_MEDIA_CONFERENCE_RECORDINGS_DIRECTORY: /app/storage/conference-recordings
      APP_MEDIA_CONFERENCE_RECORDINGS_IMPORT_DIRECTORY: /jibri-recordings
      APP_MEDIA_MESSAGE_ATTACHMENTS_MAX_SIZE_BYTES: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MAX_SIZE_BYTES:-26214400}
      APP_MEDIA_MESSAGE_ATTACHMENTS_ORPHAN_TTL: ${APP_MEDIA_MESSAGE_ATTACHMENTS_ORPHAN_TTL:-PT1H}
      APP_MEDIA_MESSAGE_ATTACHMENTS_ORPHAN_CLEANUP_FIXED_DELAY_MS: ${APP_MEDIA_MESSAGE_ATTACHMENTS_ORPHAN_CLEANUP_FIXED_DELAY_MS:-900000}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_ENDPOINT: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_ENDPOINT:-http://minio:9000}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_PUBLIC_ENDPOINT: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_PUBLIC_ENDPOINT:?APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_PUBLIC_ENDPOINT must be set}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_ACCESS_KEY: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_ACCESS_KEY:?APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_ACCESS_KEY must be set}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_SECRET_KEY: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_SECRET_KEY:?APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_SECRET_KEY must be set}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_BUCKET: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_BUCKET:-message-attachments}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_REGION: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_REGION:-us-east-1}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_PATH_STYLE_ACCESS: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_PATH_STYLE_ACCESS:-true}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_AUTO_CREATE_BUCKET: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_AUTO_CREATE_BUCKET:-true}
      APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_PRESIGNED_URL_TTL: ${APP_MEDIA_MESSAGE_ATTACHMENTS_MINIO_PRESIGNED_URL_TTL:-PT10M}
      APP_PUSH_ENABLED: ${APP_PUSH_ENABLED:-true}
      APP_PUSH_SUBJECT: ${APP_PUSH_SUBJECT:-mailto:no-reply@localhost.test}
      APP_PUSH_VAPID_PUBLIC_KEY: ${APP_PUSH_VAPID_PUBLIC_KEY:-}
      APP_PUSH_VAPID_PRIVATE_KEY: ${APP_PUSH_VAPID_PRIVATE_KEY:-}
      APP_PUSH_REQUEST_TIMEOUT: ${APP_PUSH_REQUEST_TIMEOUT:-PT5S}
      APP_PUSH_TTL: ${APP_PUSH_TTL:-PT1M}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    volumes:
      - conference_recordings_archive:/app/storage/conference-recordings
      - conference_recordings_raw:/jibri-recordings:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    profiles:
      - observability
    container_name: messenger-postgres-exporter
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/messenger?sslmode=disable
      DATA_SOURCE_USER: ${DB_USERNAME:-messenger}
      DATA_SOURCE_PASS: ${DB_PASSWORD:?DB_PASSWORD must be set}

  tempo:
    image: mirror.gcr.io/grafana/tempo:2.9.0
    profiles:
      - observability
    container_name: messenger-tempo
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.139.0
    profiles:
      - observability
    container_name: messenger-otel-collector
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    depends_on:
      tempo:
        condition: service_started
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: mirror.gcr.io/prom/prometheus:v3.5.0
    profiles:
      - observability
    container_name: messenger-prometheus
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ACTUATOR_SCRAPE_USERNAME: ${APP_ACTUATOR_SCRAPE_USERNAME:-}
      APP_ACTUATOR_SCRAPE_PASSWORD: ${APP_ACTUATOR_SCRAPE_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - /etc/prometheus/start-prometheus.sh
    depends_on:
      backend:
        condition: service_started
      postgres-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/observability/start-prometheus.sh:/etc/prometheus/start-prometheus.sh:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: mirror.gcr.io/prom/alertmanager:v0.28.1
    profiles:
      - observability
    container_name: messenger-alertmanager
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
    entrypoint:
      - /bin/sh
      - /etc/alertmanager/start-alertmanager.sh
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/observability/render-alertmanager-config.sh:/etc/alertmanager/render-config.sh:ro
      - ./deploy/observability/start-alertmanager.sh:/etc/alertmanager/start-alertmanager.sh:ro
      - alertmanager_data:/alertmanager

  loki:
    image: mirror.gcr.io/grafana/loki:3.1.1
    profiles:
      - observability
    container_name: messenger-loki
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: mirror.gcr.io/grafana/promtail:3.1.1
    profiles:
      - observability
    container_name: messenger-promtail
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./deploy/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/positions

  grafana:
    image: mirror.gcr.io/grafana/grafana:10.3.0
    profiles:
      - observability
    container_name: messenger-grafana
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SERVER_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
      GF_SERVER_ROOT_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}/observability/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
        VITE_APP_REVISION: ${WEB_APP_REVISION:-dev}
        VITE_WS_URL: ""
        VITE_JITSI_BASE_URL: ${JITSI_PUBLIC_URL:?JITSI_PUBLIC_URL must be set}
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 96m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      jitsi-web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  edge:
    image: public.ecr.aws/docker/library/caddy:2.9-alpine
    container_name: messenger-edge
    init: true
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
      jitsi-web:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  jitsi_prosody_config:
  jitsi_jicofo_config:
  jitsi_jvb_config:
  jitsi_jibri_config:
  jitsi_web_config:
  prometheus_data:
  tempo_data:
  conference_recordings_raw:
  conference_recordings_archive:
  promtail_positions:
