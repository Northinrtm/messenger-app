jicofo {
  conference {
    // Keep conference alive for 5 minutes after only one participant remains,
    // so they are not kicked immediately when the other party disconnects.
    single-participant-timeout = 5 minutes
  }
  bridge {
    // How long Jicofo waits for a bridge to respond to a Colibri allocation
    // request. Default is 5s — too short when JVB is under GC pressure or
    // just restarted. Raising to 20s prevents spurious allocation failures.
    selection-timeout = 20 seconds
    // Retry once before giving up, giving JVB time to recover from a brief stall.
    max-bridge-failures = 1
  }
}
