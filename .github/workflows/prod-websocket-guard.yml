name: Production WebSocket Guard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: production-websocket-guard
  cancel-in-progress: true

jobs:
  websocket-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      PROD_APP_DIR: ${{ vars.PROD_APP_DIR || secrets.PROD_APP_DIR || '/opt/messenger-app' }}
      PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST || secrets.PROD_SSH_HOST || '83.147.244.194' }}
      PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT || secrets.PROD_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ vars.PROD_SSH_USER || secrets.PROD_SSH_USER || 'deploy' }}
      WS_ALERT_WINDOW: 10m
      WS_ALERT_MAX_TOTAL: 180
      WS_ALERT_MAX_429: 30
      WS_ALERT_MAX_PER_IP: 120
    steps:
      - name: Prepare SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_USER"
          test -n "$PROD_SSH_KEY"
          : "${PROD_SSH_PORT:=22}"
          : "${PROD_APP_DIR:=/opt/messenger-app}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$PROD_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PROD_SSH_PORT}" -H "${PROD_SSH_HOST}" > ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts

      - name: Fetch websocket access logs
        run: |
          ssh \
            -p "${PROD_SSH_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "WS_ALERT_WINDOW='${WS_ALERT_WINDOW}' PROD_APP_DIR='${PROD_APP_DIR}' bash -s" > ws-access.log <<'REMOTE'
          set -euo pipefail
          cd "${PROD_APP_DIR:-/opt/messenger-app}"
          if docker compose version >/dev/null 2>&1; then
            dc='docker compose -f docker-compose.prod.yml --env-file .env.prod'
          else
            dc='docker-compose -f docker-compose.prod.yml --env-file .env.prod'
          fi
          sh -lc "eval \"$dc logs --no-log-prefix --since ${WS_ALERT_WINDOW:-10m} edge 2>&1\" || true"
          REMOTE

      - name: Analyze websocket activity
        id: analyze
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          log_path = Path("ws-access.log")
          total = 0
          count_429 = 0
          by_ip = collections.Counter()
          by_status = collections.Counter()

          if log_path.exists():
            for raw_line in log_path.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line:
                continue
              try:
                item = json.loads(line)
              except json.JSONDecodeError:
                continue
              request = item.get("request")
              if not isinstance(request, dict):
                continue
              request_uri = str(request.get("uri", ""))
              if not request_uri.startswith("/ws"):
                continue
              status = str(item.get("status", ""))
              remote_addr = str(
                request.get("client_ip")
                or request.get("remote_ip")
                or item.get("remote_ip")
                or "unknown"
              )
              total += 1
              count_429 += int(status == "429")
              by_ip[remote_addr] += 1
              by_status[status] += 1

          top_ip = "none"
          top_ip_count = 0
          if by_ip:
            top_ip, top_ip_count = by_ip.most_common(1)[0]

          top_sources = ", ".join(
            f"{ip} x {count}" for ip, count in by_ip.most_common(5)
          ) or "none"
          status_counts = ", ".join(
            f"{status}={count}" for status, count in sorted(by_status.items())
          ) or "none"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"total={total}\n")
            fh.write(f"count_429={count_429}\n")
            fh.write(f"top_ip={top_ip}\n")
            fh.write(f"top_ip_count={top_ip_count}\n")
            fh.write(f"top_sources={top_sources}\n")
            fh.write(f"status_counts={status_counts}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
            fh.write("## WebSocket Guard\n\n")
            fh.write(f"- Window: `{os.environ['WS_ALERT_WINDOW']}`\n")
            fh.write(f"- Total `/ws` requests: `{total}`\n")
            fh.write(f"- `429` responses: `{count_429}`\n")
            fh.write(f"- Top source: `{top_ip}` x `{top_ip_count}`\n")
            fh.write(f"- Top sources: `{top_sources}`\n")
            fh.write(f"- Status counts: `{status_counts}`\n")
          PY

      - name: Enforce websocket thresholds
        run: |
          echo "Window: ${WS_ALERT_WINDOW}"
          echo "Total /ws requests: ${{ steps.analyze.outputs.total }}"
          echo "429 responses: ${{ steps.analyze.outputs.count_429 }}"
          echo "Top source: ${{ steps.analyze.outputs.top_ip }} x ${{ steps.analyze.outputs.top_ip_count }}"

          failures=0

          if [ "${{ steps.analyze.outputs.total }}" -gt "${WS_ALERT_MAX_TOTAL}" ]; then
            echo "Too many /ws requests in ${WS_ALERT_WINDOW}: ${{ steps.analyze.outputs.total }} > ${WS_ALERT_MAX_TOTAL}" >&2
            failures=1
          fi

          if [ "${{ steps.analyze.outputs.count_429 }}" -gt "${WS_ALERT_MAX_429}" ]; then
            echo "Too many websocket 429 responses in ${WS_ALERT_WINDOW}: ${{ steps.analyze.outputs.count_429 }} > ${WS_ALERT_MAX_429}" >&2
            failures=1
          fi

          if [ "${{ steps.analyze.outputs.top_ip_count }}" -gt "${WS_ALERT_MAX_PER_IP}" ]; then
            echo "Single source is reconnecting too aggressively: ${{ steps.analyze.outputs.top_ip }} x ${{ steps.analyze.outputs.top_ip_count }} > ${WS_ALERT_MAX_PER_IP}" >&2
            failures=1
          fi

          test "$failures" -eq 0
