name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      PROD_APP_DIR: /opt/messenger-app
      PROD_SSH_HOST: 83.147.244.194
      PROD_SSH_PORT: 22
      PROD_SSH_USER: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '83.147.244.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK2cHhiEos88Xey5dTe+zCoD7Nqua+A2sVKOeWc9ePAc' \
            '83.147.244.194 ssh-rsa ' \
            '83.147.244.194 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBDtanlCse8EodihyNRiMMNUjhGy9sZ2X23CRAwGcLIkJUOGIThhSqGbdGAJLZDU/BURltxL5I7uLhLGm9mtuHrc=' \
            >> ~/.ssh/known_hosts

      - name: Upload deploy script
        run: |
          scp \
            -P "${PROD_SSH_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            deploy/remote-update.sh "$PROD_SSH_USER@$PROD_SSH_HOST:/tmp/messenger-remote-update.sh"

      - name: Deploy stack
        run: |
          REMOTE_LOG="/tmp/messenger-remote-update.log"
          REMOTE_EXIT="/tmp/messenger-remote-update.exit"

          ssh \
            -p "${PROD_SSH_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "rm -f '$REMOTE_LOG' '$REMOTE_EXIT' && chmod +x /tmp/messenger-remote-update.sh && nohup env DEPLOY_STATUS_FILE='$REMOTE_EXIT' /tmp/messenger-remote-update.sh '${PROD_APP_DIR:-/opt/messenger-app}' > '$REMOTE_LOG' 2>&1 </dev/null &"

          for attempt in $(seq 1 180); do
            output="$(ssh \
              -p "${PROD_SSH_PORT:-22}" \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "status=''; if [ -f '$REMOTE_EXIT' ]; then status=\$(cat '$REMOTE_EXIT'); fi; echo \"__STATUS__:\$status\"; tail -n 60 '$REMOTE_LOG' 2>/dev/null || true")"

            echo "$output"

            status="$(printf '%s\n' "$output" | sed -n 's/^__STATUS__://p' | tail -n 1)"
            if [ -n "$status" ]; then
              test "$status" = "0"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for remote deployment to finish." >&2
          exit 1
