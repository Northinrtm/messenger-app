name: Deploy Production

on:
  workflow_call:
    inputs:
      full_reset:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_reset:
        description: "Remove containers and named volumes before deploy for a fresh start"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      PROD_APP_DIR: ${{ vars.PROD_APP_DIR || secrets.PROD_APP_DIR || '/opt/messenger-app' }}
      PROD_PUBLIC_BASE_URL: ${{ vars.PROD_PUBLIC_BASE_URL || secrets.PROD_PUBLIC_BASE_URL || 'https://pishi.ktsf.ru' }}
      PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST || secrets.PROD_SSH_HOST || '83.147.244.194' }}
      PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT || secrets.PROD_SSH_PORT || '22' }}
      PROD_SSH_USER: ${{ vars.PROD_SSH_USER || secrets.PROD_SSH_USER || 'deploy' }}
      FULL_RESET: ${{ inputs.full_reset && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_USER"
          test -n "$PROD_SSH_KEY"
          : "${PROD_SSH_PORT:=22}"
          : "${PROD_APP_DIR:=/opt/messenger-app}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$PROD_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PROD_SSH_PORT}" -H "${PROD_SSH_HOST}" > ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts

      - name: Upload deploy script
        run: |
          scp \
            -P "${PROD_SSH_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            deploy/remote-update.sh "$PROD_SSH_USER@$PROD_SSH_HOST:/tmp/messenger-remote-update.sh"

      - name: Deploy stack
        run: |
          REMOTE_LOG="/tmp/messenger-remote-update.log"
          REMOTE_EXIT="/tmp/messenger-remote-update.exit"
          WAIT_INTERVAL_SECONDS="${WAIT_INTERVAL_SECONDS:-10}"
          WAIT_ATTEMPTS="${WAIT_ATTEMPTS:-330}"

          ssh \
            -p "${PROD_SSH_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "rm -f '$REMOTE_LOG' '$REMOTE_EXIT' && chmod +x /tmp/messenger-remote-update.sh && nohup env DEPLOY_STATUS_FILE='$REMOTE_EXIT' PROD_PUBLIC_BASE_URL='${PROD_PUBLIC_BASE_URL}' PROD_PUBLIC_IP='${PROD_SSH_HOST}' FULL_RESET='${FULL_RESET}' /tmp/messenger-remote-update.sh '${PROD_APP_DIR:-/opt/messenger-app}' > '$REMOTE_LOG' 2>&1 </dev/null &"

          for attempt in $(seq 1 "$WAIT_ATTEMPTS"); do
            output="$(ssh \
              -p "${PROD_SSH_PORT:-22}" \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "status=''; if [ -f '$REMOTE_EXIT' ]; then status=\$(cat '$REMOTE_EXIT'); fi; echo \"__STATUS__:\$status\"; tail -n 60 '$REMOTE_LOG' 2>/dev/null || true")"

            echo "$output"

            status="$(printf '%s\n' "$output" | sed -n 's/^__STATUS__://p' | tail -n 1)"
            if [ -n "$status" ]; then
              test "$status" = "0"
              exit 0
            fi

            sleep "$WAIT_INTERVAL_SECONDS"
          done

          echo "Timed out waiting for remote deployment to finish." >&2
          exit 1

      - name: Verify public revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test -n "$PROD_PUBLIC_BASE_URL"
          test -n "$EXPECTED_REVISION"
          base_url="${PROD_PUBLIC_BASE_URL%/}"

          for attempt in $(seq 1 18); do
            body="$(mktemp)"
            if curl -fsS --max-time 20 --retry 1 --retry-delay 2 -o "$body" "$base_url/build-meta.json"; then
              if python -c 'import json, sys; body_path = sys.argv[1]; expected_revision = sys.argv[2].strip(); payload = json.load(open(body_path, encoding="utf-8")); revision = str(payload.get("revision", "")).strip(); built_at = str(payload.get("builtAt", "")).strip(); revision or sys.exit("build-meta.json is missing revision"); built_at or sys.exit("build-meta.json is missing builtAt"); revision == expected_revision or sys.exit(f"Expected public revision {expected_revision}, got {revision}"); print(f"Verified public revision {revision} built at {built_at}")' "$body" "$EXPECTED_REVISION"
              then
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Public deployment never exposed revision $EXPECTED_REVISION" >&2
          exit 1
