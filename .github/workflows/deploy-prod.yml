name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_APP_DIR: /opt/messenger-app
      PROD_SSH_HOST: 83.147.244.194
      PROD_SSH_PORT: 22
      PROD_SSH_USER: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PROD_SSH_PORT:-22}" "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload deploy script
        run: |
          scp -P "${PROD_SSH_PORT:-22}" deploy/remote-update.sh "$PROD_SSH_USER@$PROD_SSH_HOST:/tmp/messenger-remote-update.sh"

      - name: Deploy stack
        run: |
          ssh -p "${PROD_SSH_PORT:-22}" "$PROD_SSH_USER@$PROD_SSH_HOST" "chmod +x /tmp/messenger-remote-update.sh && /tmp/messenger-remote-update.sh '${PROD_APP_DIR:-/opt/messenger-app}'"
