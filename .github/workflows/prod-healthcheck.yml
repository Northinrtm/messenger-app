name: Production Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: production-healthcheck
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      PROD_PUBLIC_BASE_URL: ${{ vars.PROD_PUBLIC_BASE_URL || secrets.PROD_PUBLIC_BASE_URL || 'https://pishi.ktsf.ru' }}
    steps:
      - name: Resolve latest successful main revision
        id: expected-revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json, os, sys, urllib.request; api_url = os.environ["GITHUB_API_URL"]; repo = os.environ["GITHUB_REPOSITORY"]; token = os.environ["GH_TOKEN"]; url = f"{api_url}/repos/{repo}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=20"; request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}", "X-GitHub-Api-Version": "2022-11-28"}); payload = json.load(urllib.request.urlopen(request, timeout=20)); revision = next((str(run.get("head_sha", "")).strip() for run in payload.get("workflow_runs", []) if run.get("conclusion") == "success" and str(run.get("head_sha", "")).strip()), ""); revision or sys.exit("No successful main CI run found"); print(f"expected_revision={revision}")' >> "$GITHUB_OUTPUT"

      - name: Check homepage
        run: |
          test -n "$PROD_PUBLIC_BASE_URL"
          base_url="${PROD_PUBLIC_BASE_URL%/}"
          body="$(mktemp)"
          code="$(curl -fsS --max-time 15 --retry 2 --retry-delay 2 -o "$body" -w "%{http_code}" "$base_url/")"
          test "$code" = "200"
          grep -qi "North Messenger" "$body"

      - name: Check public revision matches latest successful main
        env:
          EXPECTED_REVISION: ${{ steps.expected-revision.outputs.expected_revision }}
        run: |
          test -n "$PROD_PUBLIC_BASE_URL"
          test -n "$EXPECTED_REVISION"
          base_url="${PROD_PUBLIC_BASE_URL%/}"
          body="$(mktemp)"
          curl -fsS --max-time 15 --retry 2 --retry-delay 2 -o "$body" "$base_url/build-meta.json"
          python -c 'import json, sys; body_path = sys.argv[1]; expected_revision = sys.argv[2].strip(); payload = json.load(open(body_path, encoding="utf-8")); revision = str(payload.get("revision", "")).strip(); built_at = str(payload.get("builtAt", "")).strip(); revision or sys.exit("build-meta.json is missing revision"); built_at or sys.exit("build-meta.json is missing builtAt"); revision == expected_revision or sys.exit(f"Expected public revision {expected_revision}, got {revision}"); print(f"Public revision {revision} built at {built_at}")' "$body" "$EXPECTED_REVISION"

      - name: Check auth refresh responds quickly
        run: |
          test -n "$PROD_PUBLIC_BASE_URL"
          base_url="${PROD_PUBLIC_BASE_URL%/}"
          body="$(mktemp)"
          code="$(curl -sS --max-time 15 --retry 1 --retry-delay 2 -o "$body" -w "%{http_code}" -X POST "$base_url/api/auth/refresh")"
          test "$code" = "403"
          grep -q '"status":403' "$body"
